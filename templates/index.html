<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>AI 학교 재난영향 예측·자동보고 시스템 (데모)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
  body { font-family: system-ui, sans-serif; max-width: 1280px; margin: 1.5rem auto; padding: 0 1rem; background:#0b1020; color:#e6edf7; }
  h1 { font-size: 1.4rem; margin-bottom: .4rem; }
  h2 { font-size: 1.1rem; margin: 1.5rem 0 .6rem; padding-top: .5rem; border-top: 1px solid #22315a; }
  h2:first-of-type { border-top: 0; padding-top: 0; }
  .badge { display:inline-block; padding:.2rem .5rem; background:#22315a; border-radius:4px; font-size:.8rem; }
  .alert { padding:.8rem; background:#1a2444; border-radius:6px; margin:.4rem 0; cursor:pointer; }
  .alert:hover { background:#243066; }
  pre { background:#101830; padding:1rem; white-space:pre-wrap; border-radius:6px; }
  .disclaimer { margin-top:1rem; padding:.6rem; background:#3a2a16; border-left:4px solid #f0a040; font-size:.9rem; }
  button { background:#3060d0; color:white; border:0; padding:.4rem .8rem; border-radius:4px; cursor:pointer; }
  button:hover { background:#3f70e0; }
  select, input { background:#1a2444; color:#e6edf7; border:1px solid #2a3a5a; padding:.3rem .5rem; border-radius:4px; font-size:.9rem; }
  label { font-size:.9rem; color:#a8b6d0; }
  .controls { display:flex; gap:.6rem; align-items:center; flex-wrap:wrap; margin-bottom:.6rem; }
  .map-wrap { display:grid; grid-template-columns: 1fr 280px; gap: .8rem; }

  /* 지도 셸 + 로딩 오버레이 — 마커는 그대로 두고 베일만 fade */
  .map-shell { position: relative; height: 540px; border-radius: 6px; overflow: hidden; }
  #map { height: 100%; }
  .map-shell::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(11, 16, 32, 0.35);
    opacity: 0;
    pointer-events: none;
    transition: opacity 160ms ease;
    z-index: 500;
  }
  .map-shell.is-loading::after { opacity: 1; }
  @media (prefers-reduced-motion: reduce) {
    .map-shell::after { transition: none; }
  }

  .info-panel { background:#1a2444; padding:.8rem; border-radius:6px; max-height:540px; overflow:auto; font-size:.9rem; line-height: 1.6; }
  .stat { font-size:.85rem; color:#a8b6d0; }
  .legend-dot { display:inline-block; width:10px; height:10px; border-radius:50%; vertical-align:middle; margin-right:.4rem; }
  .leaflet-popup-content { color:#222; min-width: 200px; line-height: 1.4; }
  .leaflet-container { background:#1a2444; }
  hr { border: 0; border-top: 1px solid #2a3a5a; margin: .6rem 0; }
  @media (max-width: 800px) { .map-wrap { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<h1>AI 학교 재난영향 예측·자동보고 시스템
  {% if demo_mode %}<span class="badge">DEMO MODE · 비식별 데이터</span>{% endif %}
</h1>

<h2>전국 학교 분포</h2>
<div class="controls">
  <label>시도 <select id="region-select">
    <option value="">전국</option>
  </select></label>
  <label>학교급
    <select id="level-select">
      <option value="">전체</option>
      <option value="초">초</option>
      <option value="중">중</option>
      <option value="고">고</option>
    </select>
  </label>
  <button id="reload">↻ 다시 로드</button>
  <span id="map-status" class="stat"></span>
</div>
<div class="map-wrap">
  <div class="map-shell" id="map-shell">
    <div id="map"></div>
  </div>
  <div class="info-panel" id="info-panel">
    <em>지역/학교급을 선택하세요.</em>
  </div>
</div>

<h2>특보 기반 자동보고</h2>
<p class="stat">특보를 선택하면 영향권 학교를 자동 식별하고 AI가 보고서 초안을 생성합니다.</p>
<div id="alerts">로딩…</div>

<h2>보고서 초안</h2>
<div id="result"><em>특보를 선택하세요.</em></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
const DEMO_MODE = {{ 'true' if demo_mode else 'false' }};
const MAP_PROVIDER = "{{ map_provider }}";
const VWORLD_KEY = "{{ vworld_api_key }}";
const REGIONS = ["서울","부산","대구","인천","광주","대전","울산","세종",
                 "경기","강원","충북","충남","전북","전남","경북","경남","제주"];
const LEVEL_COLORS = {"초":"#3ba55d","중":"#5865f2","고":"#ed4245"};
const FLY_DURATION = 0.55;        // 초
const REDUCED_MOTION = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- 시도 셀렉트 ----------
const regionSelect = document.getElementById('region-select');
REGIONS.forEach(r => {
  const opt = document.createElement('option');
  opt.value = r; opt.textContent = r;
  regionSelect.appendChild(opt);
});
regionSelect.value = DEMO_MODE ? '' : '울산';

// ---------- 지도 + 타일 ----------
const map = L.map('map', { preferCanvas: true }).setView([36.5, 127.8], 7);
const tileLayer = (MAP_PROVIDER === 'vworld' && VWORLD_KEY)
  ? L.tileLayer(`https://api.vworld.kr/req/wmts/1.0.0/${VWORLD_KEY}/Base/{z}/{y}/{x}.png`,
                { attribution: '© VWorld (국토교통부)', maxZoom: 18 })
  : L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
                { attribution: '© OpenStreetMap', maxZoom: 18 });
tileLayer.addTo(map);

// ---------- 상태 ----------
let META = null;
let activeCluster = createCluster();
map.addLayer(activeCluster);
let requestSeq = 0;
let aborter = null;
let programmaticMove = false;

function createCluster() {
  return L.markerClusterGroup({
    showCoverageOnHover: false,
    spiderfyOnMaxZoom: true,
    maxClusterRadius: 60,
    chunkedLoading: true,
    chunkedInterval: 50,
    removeOutsideVisibleBounds: true,
  });
}

function createSchoolMarker(s) {
  const m = L.circleMarker([s.lat, s.lng], {
    radius: 5,
    color: LEVEL_COLORS[s.lv] || '#888',
    fillColor: LEVEL_COLORS[s.lv] || '#888',
    fillOpacity: .85,
    weight: 1,
  });
  m.bindPopup(() => `<b>${s.n}</b><br>${s.r} · ${s.lv}<br><small>ID: ${s.id}</small>`);
  return m;
}

function setMapLoading(on) {
  document.getElementById('map-shell').classList.toggle('is-loading', on);
}

async function loadMeta() {
  try {
    const r = await fetch('/api/schools/meta');
    if (r.ok) META = await r.json();
  } catch (e) {}
}

// ---------- 핵심: D-lite 전환 패턴 ----------
async function loadMap() {
  const seq = ++requestSeq;
  if (aborter) aborter.abort();
  aborter = new AbortController();

  const region = regionSelect.value;
  const level = document.getElementById('level-select').value;

  setMapLoading(true);

  // 1) fetch 시작 (병렬)
  const params = new URLSearchParams();
  if (region) params.set('region', region);
  else        params.set('all', '1');         // 전국 = 12K 한 번
  if (level)  params.set('level', level);

  const t0 = performance.now();
  const dataPromise = fetch('/api/schools/map?' + params, { signal: aborter.signal })
    .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)));

  // 2) 카메라 이동 (병렬)
  const target = (region === '')
    ? { center: [36.5, 127.8], zoom: 7 }
    : (META?.region_bbox?.[region]
        ? { bounds: [[META.region_bbox[region].south, META.region_bbox[region].west],
                     [META.region_bbox[region].north, META.region_bbox[region].east]] }
        : null);
  if (target) moveMap(target);

  // 3) 응답 대기
  let items;
  try {
    items = await dataPromise;
  } catch (e) {
    if (e.name === 'AbortError') return;            // 중첩 요청
    setMapLoading(false);
    document.getElementById('map-status').textContent = '오류: ' + e.message;
    return;
  }
  if (seq !== requestSeq) return;                    // stale 응답 무시

  const fetchMs = performance.now() - t0;

  // 4) 새 cluster 빌드 (이전 cluster는 그대로 표시 중)
  const t1 = performance.now();
  const nextCluster = createCluster();
  nextCluster.addLayers(items.map(createSchoolMarker));
  const renderMs = performance.now() - t1;

  // 5) 카메라 도착 후 cluster 교체
  swapClusterAfterMove(nextCluster, () => {
    setMapLoading(false);
    updatePanel(items, region, level, fetchMs, renderMs);
  });
}

function moveMap(target) {
  programmaticMove = true;
  const onArrive = () => { programmaticMove = false; };

  if (REDUCED_MOTION) {
    if (target.center) map.setView(target.center, target.zoom, { animate: false });
    else map.fitBounds(target.bounds, { padding: [30, 30], animate: false });
    onArrive();
    return;
  }
  if (target.center) {
    map.flyTo(target.center, target.zoom, { duration: FLY_DURATION });
  } else {
    map.flyToBounds(target.bounds, { padding: [30, 30], duration: FLY_DURATION });
  }
  map.once('moveend', onArrive);
}

function swapClusterAfterMove(nextCluster, after) {
  const doSwap = () => {
    map.removeLayer(activeCluster);
    activeCluster.clearLayers();
    activeCluster = nextCluster;
    map.addLayer(activeCluster);
    if (after) after();
  };
  if (programmaticMove) map.once('moveend', doSwap);
  else doSwap();
}

function updatePanel(items, region, level, fetchMs, renderMs) {
  const total = items.length;
  const grand = META?.total;
  const isAll = !region;
  const countLabel = (isAll && grand)
    ? `${total.toLocaleString()} / ${grand.toLocaleString()}`
    : `${total.toLocaleString()}개`;
  document.getElementById('map-status').textContent =
    `${countLabel} · fetch ${fetchMs.toFixed(0)}ms · render ${renderMs.toFixed(0)}ms`;

  const byLevel = {"초":0, "중":0, "고":0};
  items.forEach(s => byLevel[s.lv] = (byLevel[s.lv] || 0) + 1);

  const totalLine = (isAll && grand)
    ? `전국 <b>${total.toLocaleString()}</b> / ${grand.toLocaleString()}`
    : `총 <b>${total.toLocaleString()}</b>건`;

  document.getElementById('info-panel').innerHTML = `
    <div><b>${region || '전국'}${level ? ' · ' + level : ''}</b></div>
    <div class="stat">${totalLine}</div>
    <hr>
    <div><span class="legend-dot" style="background:${LEVEL_COLORS['초']}"></span>초 ${byLevel['초'].toLocaleString()}</div>
    <div><span class="legend-dot" style="background:${LEVEL_COLORS['중']}"></span>중 ${byLevel['중'].toLocaleString()}</div>
    <div><span class="legend-dot" style="background:${LEVEL_COLORS['고']}"></span>고 ${byLevel['고'].toLocaleString()}</div>
    <hr>
    <div class="stat">마커 클릭 → 학교 상세<br>클러스터 클릭 → 줌인</div>
  `;
}

// ---------- 이벤트 ----------
regionSelect.addEventListener('change', loadMap);
document.getElementById('level-select').addEventListener('change', loadMap);
document.getElementById('reload').addEventListener('click', loadMap);

// ---------- 특보 + 보고서 (기존 그대로) ----------
async function loadAlerts() {
  const r = await fetch('/api/alerts');
  const data = await r.json();
  const c = document.getElementById('alerts');
  c.innerHTML = '';
  if (!data.length) {
    c.innerHTML = '<em class="stat">활성 특보 없음 (운영 모드)</em>';
    return;
  }
  data.forEach(a => {
    const div = document.createElement('div');
    div.className = 'alert';
    div.innerHTML = `<b>${a.type} ${a.level}</b> — ${a.regions.join(', ')}<br><small>${a.summary}</small>`;
    div.onclick = () => generate(a.id);
    c.appendChild(div);
  });
}
async function generate(alert_id) {
  const out = document.getElementById('result');
  out.innerHTML = '<em>생성 중…</em>';
  const t0 = performance.now();
  const r = await fetch('/api/draft', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({alert_id})});
  const j = await r.json();
  const elapsed = ((performance.now()-t0)/1000).toFixed(2);
  out.innerHTML = `
    <p><b>영향학교 ${j.affected_count}개</b> · 출처 <code>${j.draft.source}</code> · 처리시간 ${elapsed}s ${j.draft.error?'· <span style="color:#f88">'+j.draft.error+'</span>':''}</p>
    <pre>${j.draft.text.replace(/[<>]/g,c=>({'<':'&lt;','>':'&gt;'}[c]))}</pre>
    <div class="disclaimer">⚠ ${j.disclaimer}</div>`;
}

// ---------- 시작 ----------
loadAlerts();
loadMeta().finally(loadMap);
</script>
</body>
</html>
